name: Security analysis

'on':
  push:
    branches:
      - main
      - phase4/redis-market-data-publisher
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  dependency-audit:
    name: Python dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit backend dependencies
        run: pip-audit -r backend/requirements.txt --format json --output pip-audit-report.json
      - name: Retain dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-dependency-audit
          path: pip-audit-report.json
          if-no-files-found: warn
          retention-days: 14
