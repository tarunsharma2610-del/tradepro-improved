services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: trading_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No ports exposed to the host — only other containers on this network
    # can reach Postgres. Nothing about the DB is internet-facing.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://trading:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/trading_platform
      REDIS_URL: redis://redis:6379/0
      BROKER_CHARGE_DOCUMENT_ROOT: /var/lib/tradepro/contract-notes
    volumes:
      - broker_charge_documents:/var/lib/tradepro/contract-notes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No ports exposed to the host either — nginx is the only way in.

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://trading:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/trading_platform
      REDIS_URL: redis://redis:6379/0
      BROKER_CHARGE_DOCUMENT_ROOT: /var/lib/tradepro/contract-notes
    volumes:
      - broker_charge_documents:/var/lib/tradepro/contract-notes
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy  # backend's healthcheck only passes once `alembic upgrade head` has finished
    command: ["python", "-m", "app.worker"]
    # No exposed ports, no Nginx route — this container only runs the
    # background evaluation loop, it's not reachable from outside.

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  broker_charge_documents:
