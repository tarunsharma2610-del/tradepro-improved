name: Backend tests

'on':
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Backend pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tradepro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tradepro_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Redis server for restart recovery integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run test suite
        env:
          DATABASE_URL: "sqlite:///:memory:"
          TEST_POSTGRES_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/tradepro_test"
          REDIS_TEST_URL: "redis://localhost:6379/15"
          MASTER_ENCRYPTION_KEY: "HuszwzTH0J4Uzhmkxh7WgSPoUoZMkwOZDHZFlAZA-u24="
          SECRET_KEY: "test-secret-key-not-for-production"
          UPSTOX_CHARGE_ESTIMATES_ENABLED: "false"
        run: python -m pytest -q
      - name: Enforce broker write boundary
        run: python -m scripts.check_broker_write_boundary
      - name: Verify Alembic upgrade, downgrade and re-upgrade on SQLite
        env:
          DATABASE_URL: "sqlite:///./migration-check.db"
          MASTER_ENCRYPTION_KEY: "HuszwzTH0J4Uzhmkxh7WgSPoUoZMkwOZDHZFlAZA-u24="
          SECRET_KEY: "test-secret-key-not-for-production"
        run: |
          alembic upgrade head
          alembic downgrade 202610170001
          alembic upgrade head

      - name: Create isolated PostgreSQL 16 migration database
        env:
          PGPASSWORD: postgres
        run: createdb -h localhost -p 5432 -U postgres tradepro_migration_check
      - name: Verify Alembic upgrade, downgrade and re-upgrade on PostgreSQL 16
        env:
          DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/tradepro_migration_check"
          MASTER_ENCRYPTION_KEY: "HuszwzTH0J4Uzhmkxh7WgSPoUoZMkwOZDHZFlAZA-u24="
          SECRET_KEY: "test-secret-key-not-for-production"
        run: |
          alembic upgrade head
          alembic downgrade 202610170001
          alembic upgrade head

      - name: Exercise isolated synthetic PostgreSQL and document-volume restore
        env:
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          report_dir="$GITHUB_WORKSPACE/restore-drill-report"
          mkdir -p "$report_dir"
          trap 'rm -rf "$workdir"' EXIT
          source_db="restore_source_$GITHUB_RUN_ID"
          target_db="restore_target_$GITHUB_RUN_ID"
          key="0123456789abcdef0123456789abcdef"
          mkdir -m 700 "$workdir/source-docs" "$workdir/restored-docs"
          printf 'synthetic contract-note fixture; no customer data\n' > "$workdir/source-docs/$key"
          source_hash="$(sha256sum "$workdir/source-docs/$key" | awk '{print $1}')"
          source_size="$(wc -c < "$workdir/source-docs/$key" | tr -d ' ')"
          createdb "$source_db"
          createdb "$target_db"
          psql -v ON_ERROR_STOP=1 -d "$source_db" -c 'CREATE TABLE restore_drill_evidence (storage_key text PRIMARY KEY, source_sha256 text NOT NULL, byte_size integer NOT NULL)'
          psql -v ON_ERROR_STOP=1 -d "$source_db" -c "INSERT INTO restore_drill_evidence VALUES ('$key', '$source_hash', $source_size)"
          pg_dump -Fc "$source_db" > "$workdir/source.dump"
          tar -C "$workdir/source-docs" -czf "$workdir/documents.tgz" .
          sha256sum "$workdir/source.dump" "$workdir/documents.tgz" > "$workdir/SHA256SUMS"
          sha256sum -c "$workdir/SHA256SUMS"
          cp "$workdir/SHA256SUMS" "$report_dir/SHA256SUMS"
          cp "$workdir/source.dump" "$report_dir/source.dump"
          cp "$workdir/documents.tgz" "$report_dir/documents.tgz"
          tar -C "$workdir/restored-docs" -xzf "$workdir/documents.tgz"
          pg_restore --exit-on-error -d "$target_db" "$workdir/source.dump"
          restored_hash="$(sha256sum "$workdir/restored-docs/$key" | awk '{print $1}')"
          restored_size="$(wc -c < "$workdir/restored-docs/$key" | tr -d ' ')"
          test "$restored_hash" = "$source_hash"
          test "$restored_size" = "$source_size"
          psql -v ON_ERROR_STOP=1 -d "$target_db" -Atc "SELECT storage_key || ':' || source_sha256 || ':' || byte_size FROM restore_drill_evidence" > "$workdir/restored-metadata.txt"
          printf '%s:%s:%s\n' "$key" "$source_hash" "$source_size" > "$workdir/expected-metadata.txt"
          diff -u "$workdir/expected-metadata.txt" "$workdir/restored-metadata.txt"
          cp "$workdir/expected-metadata.txt" "$report_dir/expected-metadata.txt"
          cp "$workdir/restored-metadata.txt" "$report_dir/restored-metadata.txt"
          printf 'synthetic_restore=PASS\nsource_sha256=%s\nrestored_sha256=%s\nsource_size=%s\nrestored_size=%s\n' "$source_hash" "$restored_hash" "$source_size" "$restored_size" > "$report_dir/result.txt"
          test "$(find "$workdir/restored-docs" -maxdepth 1 -type f | wc -l | tr -d ' ')" = "1"
          dropdb "$target_db"
          dropdb "$source_db"
      - name: Retain synthetic restore drill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-restore-drill-evidence
          path: restore-drill-report/
          if-no-files-found: warn
          retention-days: 14
