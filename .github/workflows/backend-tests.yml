name: Backend tests

'on':
  push:
    branches:
      - main
      - 'safety/**'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Backend pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tradepro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tradepro_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Guard approved broker-write boundary
        run: python scripts/check_broker_write_boundary.py
      - name: Run test suite
        env:
          DATABASE_URL: "sqlite:///:memory:"
          MASTER_ENCRYPTION_KEY: "HuszwzTH0J4Uzhmkxh7WgSPUoZMkwOZDHZFlAZA-u24="
          SECRET_KEY: "test-secret-key-not-for-production"
        run: python -m pytest -q
      - name: Verify Alembic migrations on SQLite
        env:
          DATABASE_URL: "sqlite:///./migration-check.db"
          MASTER_ENCRYPTION_KEY: "HuszwzTH0J4Uzhmkxh7WgSPUoZMkwOZDHZFlAZA-u24="
          SECRET_KEY: "test-secret-key-not-for-production"
        run: alembic upgrade head
      - name: Verify Alembic migrations on PostgreSQL 16
        env:
          DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/tradepro_test"
          MASTER_ENCRYPTION_KEY: "HuszwzTH0J4Uzhmkxh7WgSPUoZMkwOZDHZFlAZA-u24="
          SECRET_KEY: "test-secret-key-not-for-production"
        run: alembic upgrade head
      - name: Verify PostgreSQL account-safety, charge-adjustment, and order-recovery concurrency
        env:
          DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/tradepro_test"
          POSTGRES_TEST_DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/tradepro_test"
          MASTER_ENCRYPTION_KEY: "HuszwzTH0J4Uzhmkxh7WgSPUoZMkwOZDHZFlAZA-u24="
          SECRET_KEY: "test-secret-key-not-for-production"
        run: python -m pytest -q tests/test_live_charge_adjustment_postgres.py tests/test_live_account_safety_postgres.py tests/test_live_order_recovery_postgres.py
