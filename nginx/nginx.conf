server {
    listen 80;
    server_name _;

    client_max_body_size 5m;

    # Backend API and the root-level health check
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    location /docs {
        proxy_pass http://backend:8000/docs;
    }
    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
    }

    # Everything else: the Next.js frontend
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --- HTTPS ---
# This is intentionally left as HTTP-only for local/first deploy. Once you
# have a real domain pointed at this server, the standard next step is
# certbot's Nginx plugin, which rewrites this file for you to add a
# 443 server block + auto-renewing Let's Encrypt certs:
#
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d yourdomain.com
#
# Do that BEFORE you point any real Upstox redirect_uri at this server —
# Upstox (like most OAuth providers) expects an https:// redirect URI.
